<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 470" width="100%" role="img" aria-label="Diagram: one dsh-hello-world bundle contains Quick Restart and Quick Terminal, which register into the settings header at order 110 and order 100">
  <title>One bundle, two components registering into the settings header</title>
  <defs>
    <linearGradient id="helloGrad2" x1="6" y1="9" x2="31" y2="27" gradientUnits="userSpaceOnUse">
      <stop stop-color="#67C7FE"/>
      <stop offset="1" stop-color="#3F77D8"/>
    </linearGradient>
    <linearGradient id="restartFill2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1B3A5C"/>
      <stop offset="1" stop-color="#16304C"/>
    </linearGradient>
    <radialGradient id="glow2" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#3F77D8" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#3F77D8" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dots2" width="26" height="26" patternUnits="userSpaceOnUse">
      <circle cx="1.4" cy="1.4" r="1.2" fill="#223047"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#5B7BB0"/>
    </marker>
    <filter id="soft2" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="14" flood-color="#02060C" flood-opacity="0.5"/>
    </filter>
  </defs>

  <rect width="1200" height="470" fill="#0A0E15"/>
  <rect width="1200" height="470" fill="url(#dots2)"/>
  <circle cx="620" cy="235" r="460" fill="url(#glow2)"/>

  <!-- Column 1: bundle -->
  <g filter="url(#soft2)">
    <rect x="48" y="162" width="248" height="190" rx="18" fill="#111827" stroke="#2A3852" stroke-width="1.5"/>
  </g>
  <g transform="translate(68 180) scale(0.62)" fill="none">
    <g fill="url(#helloGrad2)">
      <circle cx="8.6" cy="15.6" r="2.4"/>
      <circle cx="8.6" cy="25.6" r="2.4"/>
    </g>
    <path d="M16.8 9.2H21.4C27.6 9.2 31.2 13.3 31.2 18C31.2 22.7 27.6 26.8 21.4 26.8H16.8V9.2Z" stroke="url(#helloGrad2)" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <text x="68" y="238" font-family="ui-monospace, 'SFMono-Regular', Consolas, monospace" font-size="19" font-weight="600" fill="#F3F7FB">dsh-hello-world</text>
  <text x="68" y="262" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="15" fill="#8C99AE">one Cordis bundle</text>
  <rect x="68" y="278" width="126" height="26" rx="13" fill="#16233A" stroke="#33425E" stroke-width="1"/>
  <text x="82" y="296" font-family="ui-monospace, 'SFMono-Regular', Consolas, monospace" font-size="13" fill="#9FB0C8">quick-restart</text>
  <rect x="68" y="312" width="134" height="26" rx="13" fill="#16233A" stroke="#33425E" stroke-width="1"/>
  <text x="82" y="330" font-family="ui-monospace, 'SFMono-Regular', Consolas, monospace" font-size="13" fill="#9FB0C8">quick-terminal</text>

  <!-- Column 2: components -->
  <g filter="url(#soft2)">
    <rect x="380" y="96" width="330" height="150" rx="16" fill="#111827" stroke="#2A3852" stroke-width="1.5"/>
  </g>
  <text x="404" y="132" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif" font-size="24" font-weight="700" fill="#F3F7FB">Quick Restart</text>
  <rect x="632" y="110" width="54" height="24" rx="12" fill="#16233A" stroke="#33425E" stroke-width="1"/>
  <text x="659" y="127" text-anchor="middle" font-family="ui-monospace, 'SFMono-Regular', Consolas, monospace" font-size="14" fill="#67C7FE">110</text>
  <text x="404" y="164" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="17" fill="#B9C6D8">Restart button in the settings header</text>
  <text x="404" y="192" font-family="ui-monospace, 'SFMono-Regular', Consolas, monospace" font-size="15" fill="#7BE3A6">/restart · /restart --force</text>
  <text x="404" y="220" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="15" fill="#8C99AE">Restarts the Host; the page reconnects</text>

  <g filter="url(#soft2)">
    <rect x="380" y="268" width="330" height="150" rx="16" fill="#111827" stroke="#2A3852" stroke-width="1.5"/>
  </g>
  <text x="404" y="304" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif" font-size="24" font-weight="700" fill="#F3F7FB">Quick Terminal</text>
  <rect x="632" y="282" width="54" height="24" rx="12" fill="#16233A" stroke="#33425E" stroke-width="1"/>
  <text x="659" y="299" text-anchor="middle" font-family="ui-monospace, 'SFMono-Regular', Consolas, monospace" font-size="14" fill="#67C7FE">100</text>
  <text x="404" y="336" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="17" fill="#B9C6D8">Open DSH terminal button</text>
  <text x="404" y="364" font-family="ui-monospace, 'SFMono-Regular', Consolas, monospace" font-size="15" fill="#8C99AE">shell like the desktop app</text>
  <text x="404" y="392" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="15" fill="#8C99AE">Prints profile, directory, Host pid</text>

  <!-- Column 3: where they land -->
  <g filter="url(#soft2)">
    <rect x="790" y="120" width="352" height="230" rx="18" fill="#0E1526" stroke="#2A3852" stroke-width="1.5"/>
  </g>
  <text x="818" y="158" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="15" fill="#8C99AE">settings header — right side</text>

  <rect x="814" y="176" width="304" height="42" rx="21" fill="#16233A" stroke="#33425E" stroke-width="1.5"/>
  <text x="834" y="203" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="17" fill="#CFE0F5">Open DSH terminal</text>
  <text x="1096" y="203" text-anchor="end" font-family="ui-monospace, 'SFMono-Regular', Consolas, monospace" font-size="14" fill="#67C7FE">100</text>

  <rect x="814" y="230" width="304" height="42" rx="21" fill="url(#restartFill2)" stroke="#67C7FE" stroke-width="1.5"/>
  <text x="834" y="257" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="17" font-weight="600" fill="#EAF4FF">Restart</text>
  <text x="1096" y="257" text-anchor="end" font-family="ui-monospace, 'SFMono-Regular', Consolas, monospace" font-size="14" fill="#67C7FE">110</text>

  <rect x="814" y="284" width="304" height="42" rx="21" fill="none" stroke="#33425E" stroke-width="1.5" stroke-dasharray="4 4"/>
  <text x="834" y="311" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="17" fill="#5F6E86">Close</text>

  <!-- Arrows bundle -> components -->
  <path d="M300 257 C 332 257 350 171 378 171" fill="none" stroke="#5B7BB0" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M300 257 C 332 257 350 343 378 343" fill="none" stroke="#5B7BB0" stroke-width="2" marker-end="url(#arrow)"/>
  <!-- Arrows components -> header -->
  <path d="M714 171 C 748 171 758 197 788 197" fill="none" stroke="#5B7BB0" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M714 343 C 748 343 758 251 788 251" fill="none" stroke="#5B7BB0" stroke-width="2" marker-end="url(#arrow)"/>
</svg>
